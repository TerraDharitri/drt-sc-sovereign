[[bin]]
name = "rust-interact"
path = "src/interactor_main.rs"

[package]
name = "rust-interact"
version = "0.1.0"
authors = ["contact@dharitri.org"]
edition = "2021"
publish = false

[lib]
path = "src/interact.rs"

[dependencies]
toml = "0.8.6"

[dependencies.base64]
version = "0.21.0"
default-features = false
features = ["alloc"]

[dependencies.drt-dcdt-safe]
path = "../drt-dcdt-safe"

[dependencies.sov-dcdt-safe]
path = "../sov-dcdt-safe"

[dependencies.header-verifier]
path = "../header-verifier"

[dependencies.proxies]
path = "../common/proxies"

[dependencies.structs]
path = "../common/structs"

[dependencies.dharitri-sc-snippets]
version = "1.19.0"

[dependencies.dharitri-sc]
version = "1.19.0"

[dependencies.clap]
version = "4.4.7"
features = ["derive"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serial_test]
version = "3.2.0"

[dependencies.error-messages]
path = "../common/error-messages"

[dependencies.common-test-setup]
path = "../common/common-test-setup"

[features]
chain-simulator-tests = []
