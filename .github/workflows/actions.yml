
name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  id-token: write
  issues: write
  discussions: write
  pull-requests: write
  statuses: write

jobs:
  contracts:
    name: Contracts
    uses: TerraDharitri/drt-sc-actions/.github/workflows/contracts.yml@v0.1.18
    with:
      rust-toolchain: stable
      coverage-args: --ignore-filename-regex='/.cargo/git' --output ./coverage.md
      enable-interactor-tests: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
